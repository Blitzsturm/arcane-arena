<svg xmlns="http://www.w3.org/2000/svg" viewBox="-64 -64 128 128" width="256" height="256">
  <defs>
    <linearGradient id="golStone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="golCore" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>
  </defs>

  <!-- Massive Angular Boulder Shoulders (-Y and +Y) -->
  <polygon points="-24,-18 -8,-44 18,-40 24,-22 -6,-14" fill="url(#golStone)" stroke="#1e293b" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="-24,18 -8,44 18,40 24,22 -6,14" fill="url(#golStone)" stroke="#1e293b" stroke-width="3" stroke-linejoin="round"/>

  <!-- Heavy Crushing Stone Fists (+X Front) -->
  <polygon points="18,-36 44,-30 46,-14 22,-16" fill="#475569" stroke="#0f172a" stroke-width="2.8" stroke-linejoin="round"/>
  <polygon points="18,36 44,30 46,14 22,16" fill="#475569" stroke="#0f172a" stroke-width="2.8" stroke-linejoin="round"/>

  <!-- Central Monolith Torso -->
  <polygon points="-32,-16 -14,-28 20,-24 28,0 20,24 -14,28 -32,16" fill="url(#golStone)" stroke="#0f172a" stroke-width="3" stroke-linejoin="round"/>

  <!-- Glowing Magma Rune Fissures -->
  <polyline points="-18,0 -4,-14 10,-12" fill="none" stroke="url(#golCore)" stroke-width="3" stroke-linecap="round"/>
  <polyline points="-18,0 -4,14 10,12" fill="none" stroke="url(#golCore)" stroke-width="3" stroke-linecap="round"/>
  <polyline points="2,-32 14,-26 28,-24" fill="none" stroke="#fb923c" stroke-width="2.5" stroke-linecap="round"/>
  <polyline points="2,32 14,26 28,24" fill="none" stroke="#fb923c" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Golem Head & Glowing Amber Monolith Visor -->
  <polygon points="-8,-14 14,-12 22,0 14,12 -8,14 -14,0" fill="#334155" stroke="#0f172a" stroke-width="2.5" stroke-linejoin="round"/>
  <line x1="12" y1="-7" x2="16" y2="0" stroke="#fde047" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="12" y1="7" x2="16" y2="0" stroke="#fde047" stroke-width="3.5" stroke-linecap="round"/>
</svg>
