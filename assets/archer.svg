<svg xmlns="http://www.w3.org/2000/svg" viewBox="-64 -64 128 128" width="256" height="256">
  <defs>
    <radialGradient id="arcAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arcCloak" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="55%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="arcWood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="arcLeaf" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>
  </defs>

  <!-- Subtle Forest Aura -->
  <circle cx="0" cy="0" r="50" fill="url(#arcAura)" />

  <!-- Flowing Sylvan Cloak (Trailing -X) -->
  <path d="M -6 -20 C -28 -24, -44 -14, -48 -4 C -40 0, -44 8, -48 14 C -38 20, -24 22, -6 20 Z"
        fill="url(#arcCloak)" stroke="#022c22" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- Leaf Pattern Trim on Cloak -->
  <path d="M -16 -10 L -34 -5 L -22 0 L -34 6 L -16 10" fill="none" stroke="#34d399" stroke-width="1.6" stroke-opacity="0.6"/>

  <!-- Quiver of Arrows Slung Across Back (-X, -Y) -->
  <g id="archer-quiver" transform="rotate(-28 -14 -16)">
    <rect x="-24" y="-22" width="18" height="10" rx="3" fill="#78350f" stroke="#451a03" stroke-width="1.8"/>
    <!-- Fletched Arrow Tails poking out -->
    <line x1="-24" y1="-20" x2="-33" y2="-23" stroke="#fde047" stroke-width="2" stroke-linecap="round"/>
    <line x1="-24" y1="-17" x2="-34" y2="-17" stroke="#34d399" stroke-width="2" stroke-linecap="round"/>
    <line x1="-24" y1="-14" x2="-32" y2="-11" stroke="#fde047" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Leather Shoulder Pads & Tunic -->
  <ellipse cx="-2" cy="-19" rx="10" ry="8" transform="rotate(-12 -2 -19)" fill="#78350f" stroke="#451a03" stroke-width="2"/>
  <ellipse cx="-2" cy="19" rx="10" ry="8" transform="rotate(12 -2 19)" fill="#78350f" stroke="#451a03" stroke-width="2"/>
  <ellipse cx="0" cy="0" rx="15" ry="18" fill="#064e3b" stroke="#022c22" stroke-width="2.2"/>

  <!-- Ornate Sylvan Recurve Bow (Held in front +X) -->
  <g id="archer-bow">
    <!-- Bowstring drawn back to center -->
    <polyline points="24,-34 4,0 24,34" fill="none" stroke="#e2e8f0" stroke-width="1.6" stroke-opacity="0.9"/>
    <!-- Recurve Bow Limbs -->
    <path d="M 24 -35 C 30 -26, 36 -14, 36 0 C 36 14, 30 26, 24 35"
          fill="none" stroke="url(#arcWood)" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Golden Leaf Tips & Grip -->
    <path d="M 35 -7 L 38 0 L 35 7" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
    <circle cx="24" cy="-35" r="2.5" fill="#fbbf24"/>
    <circle cx="24" cy="35" r="2.5" fill="#fbbf24"/>

    <!-- Nocked Glowing Emerald Arrow (+X Axis) -->
    <line x1="4" y1="0" x2="52" y2="0" stroke="#fef3c7" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Fletching -->
    <path d="M 4 0 L -2 -4 M 4 0 L -2 4 M 8 0 L 2 -4 M 8 0 L 2 4" stroke="#34d399" stroke-width="2" stroke-linecap="round"/>
    <!-- Glowing Broadhead Tip -->
    <polygon points="48,-5 60,0 48,5 51,0" fill="url(#arcLeaf)" stroke="#059669" stroke-width="1.2"/>

    <!-- Ranger Hands (Bow Hand + Draw Hand) -->
    <circle cx="33" cy="-3" r="4.5" fill="#92400e" stroke="#451a03" stroke-width="1.5"/>
    <circle cx="5" cy="4" r="4.5" fill="#92400e" stroke="#451a03" stroke-width="1.5"/>
  </g>

  <!-- Pointed Ranger Hood (Center Head) -->
  <g id="archer-hood">
    <path d="M -18 0 C -14 -14, 2 -16, 15 0 C 2 16, -14 14, -18 0 Z"
          fill="url(#arcCloak)" stroke="#022c22" stroke-width="2.4" stroke-linejoin="round"/>
    <!-- Hood Ridge & Golden Leaf Brooch -->
    <path d="M -16 0 L 12 0" stroke="#10b981" stroke-width="2.2" stroke-linecap="round"/>
    <polygon points="10,-4 16,0 10,4 7,0" fill="#fbbf24" stroke="#78350f" stroke-width="1"/>
  </g>
</svg>
