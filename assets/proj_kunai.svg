  <circle cx="-20" cy="0" r="5" fill="none" stroke="#94a3b8" stroke-width="2.5"/>
  <line x1="-15" y1="0" x2="-2" y2="0" stroke="#e11d48" stroke-width="4" stroke-linecap="round"/>

  <!-- Diamond Assassin Kunai Blade (+X) -->
  <polygon points="-2,-9 38,0 -2,9 4,0" fill="url(#kunaiMetal)" stroke="#0f172a" stroke-width="1.8" stroke-linejoin="round"/>
  <line x1="2" y1="0" x2="30" y2="0" stroke="#f43f5e" stroke-width="2" stroke-linecap="round"/>
</svg>
