<svg xmlns="http://www.w3.org/2000/svg" viewBox="-48 -24 96 48" width="128" height="64">
  <defs>
    <linearGradient id="kunaiMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="60%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
  </defs>

  <!-- Trailing Crimson Silk Ribbon (-X) -->
  <path d="M -24 0 Q -34 -7 -45 -3 Q -36 5 -24 2" fill="none" stroke="#f43f5e" stroke-width="2.5" stroke-linecap="round"/>

