<svg xmlns="http://www.w3.org/2000/svg" viewBox="-64 -64 128 128" width="256" height="256">
  <defs>
    <radialGradient id="gobSkin" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="60%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#14532d"/>
    </radialGradient>
    <linearGradient id="gobBlade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="70%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>

  <!-- Ragged Leather Tunic & Shoulders -->
  <path d="M -14 -20 L 6 -16 L 10 0 L 6 16 L -14 20 L -22 0 Z" fill="#78350f" stroke="#291205" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="-2" cy="-18" r="8" fill="#451a03" stroke="#1e0b02" stroke-width="2"/>
  <circle cx="-2" cy="18" r="8" fill="#451a03" stroke="#1e0b02" stroke-width="2"/>

  <!-- Jagged Rusty Cleaver (Right Hand +Y, lunging +X) -->
  <g id="goblin-cleaver">
    <rect x="6" y="18" width="12" height="4.5" rx="2" fill="#451a03" stroke="#1e0b02" stroke-width="1.5"/>
    <polygon points="18,16 46,13 42,22 48,25 18,24" fill="url(#gobBlade)" stroke="#1e293b" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="12" cy="20" r="5.5" fill="url(#gobSkin)" stroke="#14532d" stroke-width="1.8"/>
  </g>

  <!-- Offhand Clawed Hand (-Y) -->
  <g id="goblin-claw">
    <circle cx="14" cy="-18" r="5" fill="url(#gobSkin)" stroke="#14532d" stroke-width="1.8"/>
    <path d="M 18 -21 L 24 -23 M 19 -18 L 25 -18 M 18 -15 L 24 -13" stroke="#fef08a" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Long Pointed Goblin Ears Swept Back -->
  <path d="M -2 -12 C -6 -32, -18 -42, -30 -44 C -22 -28, -12 -18, 4 -10 Z" fill="url(#gobSkin)" stroke="#14532d" stroke-width="2" stroke-linejoin="round"/>
  <path d="M -2 12 C -6 32, -18 42, -30 44 C -22 28, -12 18, 4 10 Z" fill="url(#gobSkin)" stroke="#14532d" stroke-width="2" stroke-linejoin="round"/>

  <!-- Goblin Head & Snout (+X) -->
  <ellipse cx="2" cy="0" rx="15" ry="13.5" fill="url(#gobSkin)" stroke="#14532d" stroke-width="2.4"/>
  <!-- Pointed Nose (+X) -->
  <polygon points="14,-4 25,0 14,4" fill="#16a34a" stroke="#14532d" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- Glowing Feral Yellow Eyes -->
  <polygon points="9,-8 15,-5 9,-3" fill="#fde047" stroke="#713f12" stroke-width="0.8"/>
  <polygon points="9,8 15,5 9,3" fill="#fde047" stroke="#713f12" stroke-width="0.8"/>
  <!-- Cranial Scars / War Paint -->
  <path d="M -8 -6 L -2 0 L -8 6" fill="none" stroke="#dc2626" stroke-width="2.2" stroke-linecap="round"/>
</svg>
