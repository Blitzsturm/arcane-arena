<svg xmlns="http://www.w3.org/2000/svg" viewBox="-64 -64 128 128" width="256" height="256">
  <defs>
    <radialGradient id="lichAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="65%" stop-color="#6366f1" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lichMantle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="lichFrost" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
  </defs>

  <!-- Necrotic Frost Sovereign Rune Circle -->
  <circle cx="0" cy="0" r="58" fill="url(#lichAura)"/>
  <circle cx="0" cy="0" r="46" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 4 2 4"/>

  <!-- Royal Tattered Mantle (-X) -->
  <path d="M -4 -26 C -34 -34, -50 -20, -56 -8 C -44 0, -48 8, -56 16 C -42 28, -24 32, -4 26 L 14 20 L 14 -20 Z"
        fill="url(#lichMantle)" stroke="#38bdf8" stroke-width="2.4" stroke-linejoin="round"/>

  <!-- Orbiting Soul Phylactery Crystals -->
  <polygon points="-22,-38 -14,-44 -6,-38 -14,-32" fill="#38bdf8" stroke="#e0f2fe" stroke-width="1.5"/>
  <polygon points="-22,38 -14,44 -6,38 -14,32" fill="#c084fc" stroke="#f5d0fe" stroke-width="1.5"/>

  <!-- Frost-Iron Spiked Pauldrons -->
  <polygon points="-6,-18 -4,-36 10,-28 14,-16" fill="#1e293b" stroke="#38bdf8" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="-6,18 -4,36 10,28 14,16" fill="#1e293b" stroke="#38bdf8" stroke-width="2" stroke-linejoin="round"/>

  <!-- Soul-Reaper Scythe Scepter (+Y Side, Extending +X) -->
  <g id="lich-scythe">
    <line x1="-20" y1="26" x2="48" y2="22" stroke="#475569" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Curved Frost Scythe Blade Sweeping Inward -->
    <path d="M 40 22 C 44 -4, 30 -24, 14 -28 C 24 -14, 30 2, 30 22 Z"
          fill="url(#lichFrost)" stroke="#0284c7" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="40" cy="22" r="5.5" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  </g>

  <!-- Crowned Lich Skull & Jagged Ice-Iron Crown (Center) -->
  <g id="lich-crown">
    <circle cx="2" cy="0" r="16" fill="#e2e8f0" stroke="#0f172a" stroke-width="2.5"/>
    <!-- Jagged 5-Spire Crown Pointing Forward (+X) -->
    <polygon points="-6,-14 14,-18 6,-8 22,-9 10,0 22,9 6,8 14,18 -6,14"
             fill="#1e293b" stroke="#38bdf8" stroke-width="2" stroke-linejoin="round"/>
    <!-- Blazing Cyan Arch-Lich Eyes -->
    <circle cx="12" cy="-6" r="3.5" fill="#38bdf8"/>
    <circle cx="12" cy="6" r="3.5" fill="#38bdf8"/>
    <circle cx="13" cy="-6" r="1.5" fill="#ffffff"/>
    <circle cx="13" cy="6" r="1.5" fill="#ffffff"/>
  </g>
</svg>
