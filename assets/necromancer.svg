<svg xmlns="http://www.w3.org/2000/svg" viewBox="-64 -64 128 128" width="256" height="256">
  <defs>
    <radialGradient id="necroAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.38"/>
      <stop offset="70%" stop-color="#831843" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="necroRobe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#500724"/>
      <stop offset="55%" stop-color="#831843"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
  </defs>

  <!-- Dark Ritual Summoning Pentagram Ring -->
  <circle cx="0" cy="0" r="52" fill="url(#necroAura)"/>
  <circle cx="0" cy="0" r="36" fill="none" stroke="#f472b6" stroke-width="1.4" stroke-dasharray="5 5" stroke-opacity="0.6"/>

  <!-- Cultist Mantle & Robes -->
  <path d="M -8 -22 C -32 -26, -44 -14, -46 0 C -44 14, -32 26, -8 22 L 10 16 L 10 -16 Z"
        fill="url(#necroRobe)" stroke="#3b0764" stroke-width="2.4" stroke-linejoin="round"/>

  <!-- Spiked Bone Pauldrons -->
  <polygon points="-4,-16 -12,-32 2,-26 8,-16" fill="#e2e8f0" stroke="#475569" stroke-width="1.8" stroke-linejoin="round"/>
  <polygon points="-4,16 -12,32 2,26 8,16" fill="#e2e8f0" stroke="#475569" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- Skull-Topped Necromancer Staff (+Y side pointing +X) -->
  <g id="necro-staff">
    <line x1="-12" y1="22" x2="36" y2="20" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
    <!-- Mini Skull on Staff Tip -->
    <circle cx="40" cy="20" r="6.5" fill="#f1f5f9" stroke="#334155" stroke-width="1.8"/>
    <!-- Fel Green Summoning Orbs -->
    <circle cx="48" cy="14" r="3.2" fill="#4ade80"/>
    <circle cx="48" cy="26" r="3.2" fill="#f472b6"/>
    <circle cx="42" cy="18" r="1.6" fill="#4ade80"/>
    <circle cx="42" cy="22" r="1.6" fill="#4ade80"/>
  </g>

  <!-- Hooded Skull Crown (Center) -->
  <path d="M -16 0 C -14 -15, 4 -17, 16 0 C 4 17, -14 15, -16 0 Z"
        fill="#831843" stroke="#fbcfe8" stroke-width="2"/>
  <polygon points="8,-6 15,0 8,6 4,0" fill="#4ade80" stroke="#14532d" stroke-width="1"/>
</svg>
