<svg xmlns="http://www.w3.org/2000/svg" viewBox="-48 -32 96 64" width="128" height="86">
  <defs>
    <radialGradient id="fireCore" cx="60%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#fef08a"/>
      <stop offset="75%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fireTail" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#f97316" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#fde047" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- Blazing Comet Flame Tail (-X) -->
  <path d="M 16 -18 C -4 -22, -26 -16, -44 -8 C -28 -3, -34 0, -46 4 C -28 10, -14 18, 16 18 Z"
        fill="url(#fireTail)"/>
  <!-- Inner White-Hot Flame Tongue -->
  <path d="M 18 -10 C 0 -12, -16 -8, -28 -2 C -16 2, 0 12, 18 10 Z"
        fill="#fef08a" fill-opacity="0.9"/>

  <!-- Molten Fireball Core (+X Head) -->
  <circle cx="16" cy="0" r="18" fill="url(#fireCore)"/>
  <circle cx="18" cy="0" r="9" fill="#ffffff"/>

  <!-- Trailing Ember Sparks -->
  <circle cx="-26" cy="-12" r="2.8" fill="#fde047"/>
  <circle cx="-36" cy="8" r="2.2" fill="#fb923c"/>
  <circle cx="-18" cy="13" r="3" fill="#fef08a"/>
</svg>
