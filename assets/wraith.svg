<svg xmlns="http://www.w3.org/2000/svg" viewBox="-64 -64 128 128" width="256" height="256">
  <defs>
    <radialGradient id="wraithAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#6b21a8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wraithCloak" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#581c87"/>
      <stop offset="60%" stop-color="#3b0764"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="wraithClaw" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#f0abfc"/>
    </linearGradient>
  </defs>

  <!-- Ethereal Spectral Glow -->
  <circle cx="0" cy="0" r="54" fill="url(#wraithAura)"/>

  <!-- Jagged Trailing Spectral Tendrils (-X) -->
  <path d="M 8 -22 C -18 -28, -38 -24, -56 -16 C -40 -10, -34 -6, -52 0 C -34 6, -40 10, -56 16 C -38 24, -18 28, 8 22 Z"
        fill="url(#wraithCloak)" stroke="#7e22ce" stroke-width="2" stroke-linejoin="round"/>

  <!-- Void Energy Core -->
  <ellipse cx="2" cy="0" rx="16" ry="19" fill="#1e1b4b" stroke="#a855f7" stroke-width="2.2"/>

  <!-- Lunging Spectral Scythe-Claws (+X) -->
  <!-- Left Claw (-Y) -->
  <path d="M 6 -20 C 22 -30, 38 -26, 52 -12 C 36 -16, 22 -16, 8 -12 Z"
        fill="url(#wraithClaw)" stroke="#f5d0fe" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Right Claw (+Y) -->
  <path d="M 6 20 C 22 30, 38 26, 52 12 C 36 16, 22 16, 8 12 Z"
        fill="url(#wraithClaw)" stroke="#f5d0fe" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Phantom Hood & Glowing Void Visage -->
  <path d="M -18 0 C -12 -16, 6 -18, 20 0 C 6 18, -12 16, -18 0 Z"
        fill="#3b0764" stroke="#c084fc" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- Glowing Cyan/Magenta Spectral Eyes -->
  <polygon points="10,-7 18,-3 10,-1" fill="#e879f9"/>
  <polygon points="10,7 18,3 10,1" fill="#e879f9"/>
  <circle cx="13" cy="-4" r="1.5" fill="#ffffff"/>
  <circle cx="13" cy="4" r="1.5" fill="#ffffff"/>
</svg>
