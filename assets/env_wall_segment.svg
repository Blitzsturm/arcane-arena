<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 64">
  <defs>
    <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070a12"/>
      <stop offset="35%" stop-color="#1e293b"/>
      <stop offset="75%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="sconceGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Main Parapet Wall Body -->
  <rect x="0" y="0" width="200" height="44" fill="url(#wallGrad)" stroke="#0f172a" stroke-width="1"/>
  <!-- Masonry Block Courses -->
  <g stroke="#0f172a" stroke-width="1.5" opacity="0.7">
    <line x1="0" y1="18" x2="200" y2="18"/>
    <line x1="50" y1="0" x2="50" y2="18"/>
    <line x1="150" y1="0" x2="150" y2="18"/>
    <line x1="25" y1="18" x2="25" y2="36"/>
    <line x1="100" y1="18" x2="100" y2="36"/>
    <line x1="175" y1="18" x2="175" y2="36"/>
  </g>
  <!-- Crenellated Merlons Along Inner Parapet Edge -->
  <rect x="8" y="26" width="36" height="18" rx="2" fill="#334155" stroke="#64748b" stroke-width="1.2"/>
  <rect x="58" y="26" width="36" height="18" rx="2" fill="#334155" stroke="#64748b" stroke-width="1.2"/>
  <rect x="108" y="26" width="36" height="18" rx="2" fill="#334155" stroke="#64748b" stroke-width="1.2"/>
  <rect x="158" y="26" width="36" height="18" rx="2" fill="#334155" stroke="#64748b" stroke-width="1.2"/>
  <!-- Gold & Arcane Ward Strip on Arena Boundary Curb -->
  <rect x="0" y="42" width="200" height="6" fill="#b45309"/>
  <line x1="0" y1="45" x2="200" y2="45" stroke="#38bdf8" stroke-width="2" stroke-dasharray="16 8"/>
  <!-- Wall Torch Sconce at Center (X=100) -->
  <rect x="95" y="34" width="10" height="14" rx="2" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2"/>
  <circle cx="100" cy="46" r="14" fill="url(#sconceGlow)"/>
  <circle cx="100" cy="46" r="4" fill="#ffffff"/>
</svg>
