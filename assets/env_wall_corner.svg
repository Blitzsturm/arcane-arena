<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="turretStone" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="65%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>
    <radialGradient id="beaconFire" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#fde047"/>
      <stop offset="65%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Corner Bastion Base -->
  <rect x="0" y="0" width="96" height="96" rx="6" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  <!-- Octagonal Sentinel Turret -->
  <polygon points="36,10 80,10 106,36 106,80 80,106 36,106 10,80 10,36" fill="url(#turretStone)" stroke="#f59e0b" stroke-width="2.5"/>
  <!-- Crenellations / Buttresses -->
  <g fill="#475569" stroke="#94a3b8" stroke-width="1">
    <rect x="50" y="6" width="16" height="10" rx="1"/>
    <rect x="50" y="100" width="16" height="10" rx="1"/>
    <rect x="6" y="50" width="10" height="16" rx="1"/>
    <rect x="100" y="50" width="10" height="16" rx="1"/>
  </g>
  <!-- Inner Brazier Bowl -->
  <circle cx="58" cy="58" r="24" fill="#090d16" stroke="#d97706" stroke-width="3"/>
  <circle cx="58" cy="58" r="26" fill="url(#beaconFire)"/>
  <polygon points="58,38 64,52 78,58 64,64 58,78 52,64 38,58 52,52" fill="#fef08a" opacity="0.9"/>
  <circle cx="58" cy="58" r="6" fill="#ffffff"/>
</svg>
