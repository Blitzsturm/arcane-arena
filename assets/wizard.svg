<svg xmlns="http://www.w3.org/2000/svg" viewBox="-64 -64 128 128" width="256" height="256">
  <defs>
    <radialGradient id="wizAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.38"/>
      <stop offset="65%" stop-color="#0284c7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wizRobe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c4a6e"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <radialGradient id="wizHat" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="70%" stop-color="#0c4a6e"/>
      <stop offset="100%" stop-color="#082f49"/>
    </radialGradient>
    <radialGradient id="wizOrb" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#38bdf8"/>
      <stop offset="85%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </radialGradient>
  </defs>

  <!-- Arcane Barrier & Runic Circle Underfoot -->
  <circle cx="0" cy="0" r="54" fill="url(#wizAura)" />
  <circle cx="0" cy="0" r="38" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="6 4" stroke-opacity="0.55"/>

  <!-- Flowing Astral Robes & Mantle -->
  <path d="M -8 -22 C -32 -26, -46 -14, -48 0 C -46 14, -32 26, -8 22 L 10 18 L 10 -18 Z"
        fill="url(#wizRobe)" stroke="#082f49" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- Gold Constellation Trim -->
  <path d="M -28 -14 L -36 0 L -28 14" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Floating Spell Grimoire (Left Side -Y, hovering forward) -->
  <g id="wizard-tome" transform="translate(16, -26) rotate(-18)">
    <rect x="-9" y="-7" width="18" height="14" rx="2" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
    <line x1="0" y1="-7" x2="0" y2="7" stroke="#92400e" stroke-width="2"/>
    <!-- Glowing Runes on Open Pages -->
    <line x1="-6" y1="-3" x2="-2" y2="-3" stroke="#0284c7" stroke-width="1.5"/>
    <line x1="-6" y1="1" x2="-2" y2="1" stroke="#f97316" stroke-width="1.5"/>
    <line x1="2" y1="-3" x2="6" y2="-3" stroke="#0284c7" stroke-width="1.5"/>
    <line x1="2" y1="1" x2="6" y2="1" stroke="#9333ea" stroke-width="1.5"/>
  </g>

  <!-- Elemental Archmage Staff (Right Side +Y, pointing forward +X) -->
  <g id="wizard-staff">
    <!-- Staff Shaft -->
    <line x1="-10" y1="22" x2="38" y2="20" stroke="#78350f" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="-10" y1="22" x2="38" y2="20" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 6" stroke-linecap="round"/>
    <!-- Crescent Gold Staff Head -->
    <path d="M 35 11 C 46 10, 52 16, 52 20 C 52 24, 46 30, 35 29" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
    <!-- Floating Tri-Elemental Crystal Orb -->
    <circle cx="46" cy="20" r="8.5" fill="url(#wizOrb)" stroke="#e0f2fe" stroke-width="1.5"/>
    <!-- Orbiting Elemental Sparks (Fire, Frost, Lightning) -->
    <circle cx="56" cy="14" r="2.8" fill="#fb923c"/>
    <circle cx="56" cy="26" r="2.8" fill="#38bdf8"/>
    <circle cx="38" cy="20" r="2.4" fill="#e879f9"/>
  </g>

  <!-- Wide-Brimmed Wizard Hat (Top-Down Center) -->
  <g id="wizard-hat">
    <!-- Outer Brim -->
    <ellipse cx="0" cy="0" rx="22" ry="24" fill="url(#wizHat)" stroke="#082f49" stroke-width="2.5"/>
    <!-- Glowing Cyan Hatband -->
    <circle cx="0" cy="0" r="12.5" fill="none" stroke="#38bdf8" stroke-width="3"/>
    <polygon points="11,-3 16,0 11,3" fill="#fbbf24"/>
    <!-- Pointed Cone Tip swept backward (-X) -->
    <path d="M 10 0 C 6 -10, -8 -11, -24 -3 C -8 11, 6 10, 10 0 Z"
          fill="#0284c7" stroke="#082f49" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="-24" cy="-3" r="2.5" fill="#fbbf24"/>
  </g>
</svg>
