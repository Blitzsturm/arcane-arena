<svg xmlns="http://www.w3.org/2000/svg" viewBox="-64 -64 128 128" width="256" height="256">
  <defs>
    <radialGradient id="warAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="warCape" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="warSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="warGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="warBlade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="70%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>
  </defs>

  <!-- Subtle Ground Aura -->
  <circle cx="0" cy="0" r="52" fill="url(#warAura)" />

  <!-- Flowing Crimson Battle Cape (Trails behind -X) -->
  <path d="M -8 -22 C -34 -28, -46 -18, -50 -6 C -44 0, -48 10, -50 16 C -42 22, -28 26, -8 22 Z"
        fill="url(#warCape)" stroke="#450a0a" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M -14 -14 C -30 -16, -38 -8, -42 -2" stroke="#dc2626" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M -14 14 C -30 16, -38 8, -42 4" stroke="#dc2626" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Broadsword (Right Hand +Y side, extending forward +X) -->
  <g id="warrior-sword">
    <!-- Pommel & Grip -->
    <circle cx="-4" cy="28" r="4.5" fill="url(#warGold)" stroke="#451a03" stroke-width="1.5"/>
    <rect x="-1" y="25.5" width="11" height="5" rx="2" fill="#78350f" stroke="#451a03" stroke-width="1.5"/>
    <!-- Crossguard -->
    <path d="M 10 17 L 15 20 L 15 36 L 10 39 Z" fill="url(#warGold)" stroke="#451a03" stroke-width="1.8"/>
    <!-- Broad Blade -->
    <polygon points="15,22 54,24.5 62,28 54,31.5 15,34" fill="url(#warBlade)" stroke="#334155" stroke-width="2" stroke-linejoin="round"/>
    <!-- Glowing Golden Fuller Rune -->
    <line x1="18" y1="28" x2="50" y2="28" stroke="#f59e0b" stroke-width="2.2" stroke-linecap="round"/>
    <!-- Armored Gauntlet holding sword -->
    <circle cx="7" cy="26" r="6.5" fill="url(#warSteel)" stroke="#1e293b" stroke-width="2"/>
  </g>

  <!-- Heavy Pauldrons (Shoulders) -->
  <!-- Left Shoulder (-Y) -->
  <ellipse cx="-2" cy="-24" rx="14" ry="11" transform="rotate(-15 -2 -24)" fill="url(#warSteel)" stroke="#1e293b" stroke-width="2.5"/>
  <path d="M -12 -26 Q -2 -32 8 -24" fill="none" stroke="url(#warGold)" stroke-width="3" stroke-linecap="round"/>
  <!-- Right Shoulder (+Y) -->
  <ellipse cx="-2" cy="24" rx="14" ry="11" transform="rotate(15 -2 24)" fill="url(#warSteel)" stroke="#1e293b" stroke-width="2.5"/>
  <path d="M -12 26 Q -2 32 8 24" fill="none" stroke="url(#warGold)" stroke-width="3" stroke-linecap="round"/>

  <!-- Torso Breastplate -->
  <ellipse cx="0" cy="0" rx="18" ry="21" fill="url(#warSteel)" stroke="#1e293b" stroke-width="2.5"/>
  <path d="M 4 -15 L 15 0 L 4 15" fill="none" stroke="url(#warGold)" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Gilded Tower/Kite Shield (Left Arm -Y side, angled forward) -->
  <g id="warrior-shield">
    <path d="M 6 -34 C 20 -34, 28 -25, 30 -12 C 24 -10, 12 -14, 4 -22 Z"
          fill="#1e293b" stroke="url(#warGold)" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 11 -29 L 25 -17" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="18" cy="-23" r="3.5" fill="url(#warGold)"/>
  </g>

  <!-- Horned Great Helm (Center Head) -->
  <g id="warrior-helm">
    <!-- Left & Right Golden Horns curving forward -->
    <path d="M -4 -14 C 2 -28, 16 -30, 24 -22 C 16 -22, 6 -18, 2 -11 Z" fill="url(#warGold)" stroke="#451a03" stroke-width="1.8"/>
    <path d="M -4 14 C 2 28, 16 30, 24 22 C 16 22, 6 18, 2 11 Z" fill="url(#warGold)" stroke="#451a03" stroke-width="1.8"/>
    <!-- Helm Dome -->
    <circle cx="1" cy="0" r="14.5" fill="url(#warSteel)" stroke="#0f172a" stroke-width="2.5"/>
    <!-- Golden Crown Ridge -->
    <path d="M -13 0 L 15 0" stroke="url(#warGold)" stroke-width="4" stroke-linecap="round"/>
    <!-- Glowing Amber Visor Slit (Facing +X) -->
    <path d="M 9 -8 L 14 0 L 9 8" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Red Helm Plume trailing back -->
    <path d="M -11 0 C -22 -6, -30 -3, -34 0 C -30 3, -22 6, -11 0 Z" fill="#ef4444" stroke="#7f1d1d" stroke-width="1.5"/>
  </g>
</svg>
