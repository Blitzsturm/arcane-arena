<svg xmlns="http://www.w3.org/2000/svg" viewBox="-64 -64 128 128" width="256" height="256">
  <defs>
    <radialGradient id="rogAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rogArmor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="rogBlade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="55%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
  </defs>

  <!-- Shadow Mist Aura -->
  <circle cx="0" cy="0" r="50" fill="url(#rogAura)" />

  <!-- Twin Flowing Crimson Scarf Tails (Trailing -X) -->
  <path d="M -8 -8 C -28 -20, -42 -22, -54 -14 C -42 -10, -30 -6, -12 -2 Z"
        fill="#e11d48" stroke="#881337" stroke-width="2" stroke-linejoin="round"/>
  <path d="M -8 6 C -26 16, -40 22, -50 18 C -38 10, -26 6, -12 2 Z"
        fill="#be123c" stroke="#881337" stroke-width="2" stroke-linejoin="round"/>

  <!-- Twin Curved Assassin Daggers (Left -Y and Right +Y extended forward +X) -->
  <!-- Left Offhand Dagger (-Y) -->
  <g id="rogue-dagger-left">
    <circle cx="10" cy="-22" r="4.5" fill="#1e293b" stroke="#0f172a" stroke-width="1.5"/>
    <path d="M 14 -24 C 28 -28, 40 -23, 48 -14 C 36 -16, 24 -17, 14 -19 Z"
          fill="url(#rogBlade)" stroke="#881337" stroke-width="1.8" stroke-linejoin="round"/>
    <line x1="18" y1="-21" x2="40" y2="-17" stroke="#fb7185" stroke-width="1.6" stroke-linecap="round"/>
  </g>

  <!-- Right Mainhand Dagger (+Y) -->
  <g id="rogue-dagger-right">
    <circle cx="12" cy="22" r="4.5" fill="#1e293b" stroke="#0f172a" stroke-width="1.5"/>
    <path d="M 16 24 C 32 28, 46 22, 54 12 C 42 15, 28 17, 16 19 Z"
          fill="url(#rogBlade)" stroke="#881337" stroke-width="1.8" stroke-linejoin="round"/>
    <line x1="20" y1="21" x2="45" y2="16" stroke="#fb7185" stroke-width="1.6" stroke-linecap="round"/>
  </g>

  <!-- Sleek Obsidian Leather Shoulder Guards & Torso -->
  <path d="M -10 -22 L 8 -18 L 4 -6 L -12 -10 Z" fill="url(#rogArmor)" stroke="#090d16" stroke-width="2" stroke-linejoin="round"/>
  <path d="M -10 22 L 8 18 L 4 6 L -12 10 Z" fill="url(#rogArmor)" stroke="#090d16" stroke-width="2" stroke-linejoin="round"/>
  <ellipse cx="0" cy="0" rx="15" ry="17" fill="url(#rogArmor)" stroke="#090d16" stroke-width="2.2"/>

  <!-- Strapped Kunai Bandolier Across Chest -->
  <line x1="-8" y1="-13" x2="10" y2="13" stroke="#475569" stroke-width="3"/>
  <line x1="3" y1="-6" x2="9" y2="-10" stroke="#fb7185" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="0" y1="-1" x2="6" y2="-5" stroke="#fb7185" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Shadow Cowl & Crimson Mask (Center Head) -->
  <g id="rogue-cowl">
    <!-- Cowl Hood -->
    <path d="M -15 0 C -13 -13, 2 -15, 14 0 C 2 15, -13 13, -15 0 Z"
          fill="#1e293b" stroke="#090d16" stroke-width="2.4" stroke-linejoin="round"/>
    <!-- Crimson Scarf Wrap around Neck/Mask -->
    <path d="M 4 -10 C 11 -8, 13 8, 4 10 C 1 6, 1 -6, 4 -10 Z" fill="#e11d48" stroke="#881337" stroke-width="1.5"/>
    <!-- Glowing Crimson Assassin Eyes (+X) -->
    <polygon points="8,-6 13,-3 8,-2" fill="#fda4af"/>
    <polygon points="8,6 13,3 8,2" fill="#fda4af"/>
  </g>
</svg>
