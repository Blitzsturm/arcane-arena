<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="abyssGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.55"/>
      <stop offset="65%" stop-color="#1e1b4b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="1"/>
    </radialGradient>
  </defs>
  <rect width="100" height="100" fill="#090d15"/>
  <!-- Outer Stone Surround -->
  <rect x="2" y="2" width="96" height="96" rx="3" fill="#151d2e" stroke="#26334d" stroke-width="1"/>
  <!-- Sunken Chasm Pit -->
  <circle cx="50" cy="50" r="38" fill="url(#abyssGlow)" stroke="#b45309" stroke-width="2.5"/>
  <!-- Iron Grate Bars -->
  <g stroke="#334155" stroke-width="3.5" stroke-linecap="round">
    <line x1="24" y1="24" x2="76" y2="76"/>
    <line x1="38" y1="15" x2="85" y2="62"/>
    <line x1="15" y1="38" x2="62" y2="85"/>
    <line x1="76" y1="24" x2="24" y2="76"/>
    <line x1="62" y1="15" x2="15" y2="62"/>
    <line x1="85" y1="38" x2="38" y2="85"/>
  </g>
  <!-- Outer Bronze Rim & Rivets -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="8 6"/>
  <circle cx="50" cy="50" r="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <circle cx="50" cy="50" r="3" fill="#7dd3fc"/>
</svg>
