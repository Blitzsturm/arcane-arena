<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="mosaicCenter" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#231934"/>
      <stop offset="100%" stop-color="#131829"/>
    </radialGradient>
  </defs>
  <rect width="100" height="100" fill="#090d15"/>
  <!-- Outer Beveled Frame -->
  <rect x="2" y="2" width="96" height="96" rx="3" fill="#161f32" stroke="#2c3a57" stroke-width="1.2"/>
  <!-- Gold Filigree Border -->
  <rect x="8" y="8" width="84" height="84" rx="2" fill="none" stroke="#d97706" stroke-width="1" opacity="0.5"/>
  <!-- Corner Triangles -->
  <polygon points="10,10 30,10 10,30" fill="#1e293b" stroke="#475569" stroke-width="0.8"/>
  <polygon points="90,10 70,10 90,30" fill="#1e293b" stroke="#475569" stroke-width="0.8"/>
  <polygon points="10,90 30,90 10,70" fill="#1e293b" stroke="#475569" stroke-width="0.8"/>
  <polygon points="90,90 70,90 90,70" fill="#1e293b" stroke="#475569" stroke-width="0.8"/>
  <!-- Rotated Porphyry Diamond Inlay -->
  <polygon points="50,12 88,50 50,88 12,50" fill="url(#mosaicCenter)" stroke="#f59e0b" stroke-width="1.2" opacity="0.85"/>
  <!-- Inner 4-Pointed Astral Star -->
  <path d="M 50 26 L 56 44 L 74 50 L 56 56 L 50 74 L 44 56 L 26 50 L 44 44 Z" fill="#1e1b4b" stroke="#38bdf8" stroke-width="1" opacity="0.75"/>
  <circle cx="50" cy="50" r="4" fill="#fbbf24" opacity="0.8"/>
</svg>
