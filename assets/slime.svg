<svg xmlns="http://www.w3.org/2000/svg" viewBox="-64 -64 128 128" width="256" height="256">
  <defs>
    <radialGradient id="slimeBody" cx="38%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#a5f3fc" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#06b6d4" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0.95"/>
    </radialGradient>
    <radialGradient id="slimeCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </radialGradient>
  </defs>

  <!-- Outer Gelatinous Trail Ripples -->
  <ellipse cx="-6" cy="0" rx="44" ry="38" fill="#22d3ee" fill-opacity="0.22" stroke="#67e8f9" stroke-width="1.5" stroke-dasharray="8 6"/>

  <!-- Main Wobbly Slime Membrane -->
  <path d="M 34 0 C 34 21, 18 36, -4 35 C -24 34, -40 22, -38 0 C -40 -22, -24 -34, -4 -35 C 18 -36, 34 -21, 34 0 Z"
        fill="url(#slimeBody)" stroke="#155e75" stroke-width="3"/>

  <!-- Dual Dividing Nuclei Inside (Hinting at its Splitter nature) -->
  <circle cx="-6" cy="-10" r="10" fill="url(#slimeCore)" stroke="#064e3b" stroke-width="1.8"/>
  <circle cx="-6" cy="10" r="10" fill="url(#slimeCore)" stroke="#064e3b" stroke-width="1.8"/>
  <path d="M -6 -10 L -6 10" stroke="#a7f3d0" stroke-width="3" stroke-linecap="round"/>

  <!-- Suspended Acid Bubbles -->
  <circle cx="-22" cy="-12" r="4" fill="#cffafe" fill-opacity="0.65"/>
  <circle cx="-24" cy="10" r="5" fill="#cffafe" fill-opacity="0.55"/>
  <circle cx="6" cy="18" r="3.5" fill="#cffafe" fill-opacity="0.7"/>

  <!-- Menacing Slime Eyes (+X Front) -->
  <ellipse cx="16" cy="-9" rx="4" ry="5.5" fill="#083344"/>
  <ellipse cx="16" cy="9" rx="4" ry="5.5" fill="#083344"/>
  <circle cx="17.5" cy="-10" r="1.8" fill="#fde047"/>
  <circle cx="17.5" cy="8" r="1.8" fill="#fde047"/>

  <!-- Glossy Specular Highlight -->
  <path d="M -12 -24 C 0 -28, 14 -24, 20 -14" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.65"/>
</svg>
