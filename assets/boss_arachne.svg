<svg xmlns="http://www.w3.org/2000/svg" viewBox="-64 -64 128 128" width="256" height="256">
  <defs>
    <radialGradient id="spidAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spidAbdomen" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#581c87"/>
      <stop offset="65%" stop-color="#2e1065"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>
  </defs>

  <!-- Venomous Web Aura -->
  <circle cx="0" cy="0" r="58" fill="url(#spidAura)"/>

  <!-- 8 Articulated Chitinous Spider Legs -->
  <g stroke="#1e1b4b" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Left 4 Legs (-Y) -->
    <polyline points="8,-10 24,-34 46,-28"/>
    <polyline points="2,-12 10,-42 26,-52"/>
    <polyline points="-4,-12 -10,-42 -26,-50"/>
    <polyline points="-10,-10 -28,-34 -48,-28"/>
    <!-- Right 4 Legs (+Y) -->
    <polyline points="8,10 24,34 46,28"/>
    <polyline points="2,12 10,42 26,52"/>
    <polyline points="-4,12 -10,42 -26,50"/>
    <polyline points="-10,10 -28,34 -48,28"/>
  </g>
  <!-- Leg Highlight Spines -->
  <g stroke="#a855f7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <polyline points="8,-10 24,-34 46,-28"/>
    <polyline points="2,-12 10,-42 26,-52"/>
    <polyline points="-4,-12 -10,-42 -26,-50"/>
    <polyline points="-10,-10 -28,-34 -48,-28"/>
    <polyline points="8,10 24,34 46,28"/>
    <polyline points="2,12 10,42 26,52"/>
    <polyline points="-4,12 -10,42 -26,50"/>
    <polyline points="-10,10 -28,34 -48,28"/>
  </g>

  <!-- Swollen Broodmother Abdomen (-X Rear) -->
  <ellipse cx="-20" cy="0" rx="26" ry="22" fill="url(#spidAbdomen)" stroke="#a855f7" stroke-width="2.5"/>
  <!-- Glowing Hourglass & Venom sacs on Abdomen -->
  <polygon points="-28,-8 -18,0 -28,8 -12,8 -22,0 -12,-8" fill="#4ade80"/>
  <circle cx="-34" cy="-9" r="3.5" fill="#c084fc"/>
  <circle cx="-34" cy="9" r="3.5" fill="#c084fc"/>

  <!-- Cephalothorax (Center-Front) -->
  <ellipse cx="10" cy="0" rx="15" ry="13" fill="#3b0764" stroke="#c084fc" stroke-width="2.4"/>

  <!-- Dripping Venom Chelicerae / Mandibles (+X) -->
  <path d="M 22 -9 C 34 -13, 42 -8, 36 -2 C 30 -4, 26 -5, 22 -5 Z" fill="#4ade80" stroke="#064e3b" stroke-width="1.8"/>
  <path d="M 22 9 C 34 13, 42 8, 36 2 C 30 4, 26 5, 22 5 Z" fill="#4ade80" stroke="#064e3b" stroke-width="1.8"/>

  <!-- Cluster of 6 Glowing Spider Eyes (+X) -->
  <circle cx="20" cy="-4" r="2.6" fill="#4ade80"/>
  <circle cx="20" cy="4" r="2.6" fill="#4ade80"/>
  <circle cx="17" cy="-8" r="1.8" fill="#fde047"/>
  <circle cx="17" cy="8" r="1.8" fill="#fde047"/>
  <circle cx="22" cy="0" r="2" fill="#f43f5e"/>
</svg>
